name: Publish beta site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: |
          mkdir _site
          cp index.html admin.html styles.css admin.css app.js admin.js favicon.svg _site/
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('_site/config.js').write_text('window.CHAT_API_URL = ' + json.dumps(os.environ['CHAT_API_URL']) + ';\n', encoding='utf-8')
          page = Path('_site/index.html')
          page.write_text(page.read_text(encoding='utf-8').replace('./app.js"', './app.js?v=' + os.environ['GITHUB_SHA'] + '"'), encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
