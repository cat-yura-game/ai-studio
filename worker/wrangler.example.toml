name = "ai-chat-api"
main = "index.js"
compatibility_date = "2026-09-26"

[vars]
ALLOWED_ORIGIN = "https://YOUR_USERNAME.github.io"

[[d1_databases]]
binding = "DB"
database_name = "ai-chat"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "FILE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
